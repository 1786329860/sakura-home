<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c6d8"/>
      <stop offset="1" stop-color="#fdeef3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 樱花：五瓣 -->
  <g transform="translate(32,32)">
    <g fill="#f4a6c4">
      <ellipse cx="0" cy="-13" rx="7" ry="9"/>
      <ellipse cx="12.4" cy="-4" rx="7" ry="9" transform="rotate(72)"/>
      <ellipse cx="7.6" cy="10.5" rx="7" ry="9" transform="rotate(144)"/>
      <ellipse cx="-7.6" cy="10.5" rx="7" ry="9" transform="rotate(216)"/>
      <ellipse cx="-12.4" cy="-4" rx="7" ry="9" transform="rotate(288)"/>
    </g>
    <g fill="#d94f7c">
      <ellipse cx="0" cy="-11" rx="5.6" ry="7"/>
      <ellipse cx="10.5" cy="-3.4" rx="5.6" ry="7" transform="rotate(72)"/>
      <ellipse cx="6.5" cy="8.9" rx="5.6" ry="7" transform="rotate(144)"/>
      <ellipse cx="-6.5" cy="8.9" rx="5.6" ry="7" transform="rotate(216)"/>
      <ellipse cx="-10.5" cy="-3.4" rx="5.6" ry="7" transform="rotate(288)"/>
    </g>
    <circle r="5" fill="#fff3f6"/>
    <circle r="3.4" fill="#ffd66b"/>
    <circle cx="-2" cy="1.4" r="1.1" fill="#f7b8ce"/>
    <circle cx="2" cy="1.4" r="1.1" fill="#f7b8ce"/>
  </g>
  <!-- 飘落花瓣 -->
  <ellipse cx="50" cy="14" rx="4" ry="2.4" fill="#f4a6c4" opacity="0.9" transform="rotate(-30 50 14)"/>
  <ellipse cx="12" cy="46" rx="3.4" ry="2" fill="#fff0f5" opacity="0.9" transform="rotate(24 12 46)"/>
