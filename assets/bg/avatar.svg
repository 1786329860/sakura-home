<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c6d8"/>
      <stop offset="0.6" stop-color="#fde3ec"/>
      <stop offset="1" stop-color="#fff4ee"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <!-- 樱树枝（右上方垂下） -->
  <g stroke="#a8745c" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M196 14 Q180 70 150 132"/>
    <path d="M180 66 Q160 96 128 118"/>
    <path d="M170 96 Q200 108 216 132"/>
  </g>
  <!-- 枝上樱花 -->
  <g>
    <g transform="translate(150,132) scale(1.1)"><use href="#sakura"/></g>
    <g transform="translate(128,118) scale(0.85)"><use href="#sakura"/></g>
    <g transform="translate(196,14) scale(1)"><use href="#sakura"/></g>
    <g transform="translate(216,132) scale(0.9)"><use href="#sakura"/></g>
    <g transform="translate(180,66) scale(0.7)"><use href="#sakura"/></g>
  </g>
  <!-- 太阳光晕 -->
  <circle cx="196" cy="196" r="26" fill="#ffe0ec" opacity="0.55"/>
  <!-- 小屋 -->
  <rect x="58" y="130" width="86" height="66" rx="8" fill="#fff7f5"/>
  <rect x="58" y="130" width="86" height="66" rx="8" fill="none" stroke="#e8c4c9" stroke-width="3"/>
  <polygon points="46,134 101,84 156,134" fill="#d94f7c"/>
  <polygon points="46,134 101,84 156,134" fill="none" stroke="#b84060" stroke-width="3" stroke-linejoin="round"/>
  <rect x="92" y="150" width="20" height="46" fill="#f0b7c8"/>
  <rect x="66" y="150" width="16" height="16" fill="#ffe3e9" stroke="#f0b7c8" stroke-width="2"/>
  <rect x="120" y="150" width="16" height="16" fill="#ffe3e9" stroke="#f0b7c8" stroke-width="2"/>
  <!-- 草地 -->
  <rect x="26" y="196" width="188" height="12" rx="6" fill="#c8dcb4"/>
  <rect x="48" y="212" width="144" height="10" rx="5" fill="#dce8cc"/>
  <!-- 飘落花瓣 -->
  <ellipse cx="60" cy="70" rx="9" ry="5.5" fill="#f4a6c4" opacity="0.9" transform="rotate(-24 60 70)"/>
  <ellipse cx="176" cy="180" rx="8" ry="5" fill="#fff0f5" opacity="0.95" transform="rotate(30 176 180)"/>
  <ellipse cx="120" cy="240" rx="8" ry="5" fill="#f4a6c4" opacity="0.85" transform="rotate(-14 120 240)"/>
  <!-- 樱花定义 -->
  <defs>
    <g id="sakura">
      <g fill="#f7b8ce">
        <ellipse cx="0" cy="-8.4" rx="4.4" ry="5.6"/>
        <ellipse cx="8" cy="-2.6" rx="4.4" ry="5.6" transform="rotate(72)"/>
        <ellipse cx="4.9" cy="6.8" rx="4.4" ry="5.6" transform="rotate(144)"/>
        <ellipse cx="-4.9" cy="6.8" rx="4.4" ry="5.6" transform="rotate(216)"/>
        <ellipse cx="-8" cy="-2.6" rx="4.4" ry="5.6" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#d94f7c"/>
      <circle r="1.5" fill="#ffe9a8"/>
    </g>
  </defs>
</svg>
